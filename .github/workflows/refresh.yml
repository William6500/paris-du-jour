name: Relève des cotes Betclic
on:
  # Pas de déclenchement planifié : Betclic renvoie 403 aux serveurs GitHub Actions (testé le 17/11/2026).
  # La relève automatique tourne depuis la box (scripts/refresh_and_push.sh).
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Relever les cotes
        run: python scripts/fetch_odds.py && (python scripts/enrich_espn.py || true) && python scripts/build.py
      - name: Commit data.json
        run: |
          git config user.name "paris-du-jour-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Cotes Betclic du $(TZ=Europe/Paris date '+%d/%m %H:%M')" && git push)
